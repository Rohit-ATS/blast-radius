# Blast Radius on Render — one service.
#
#   blast-radius-web      public HTTPS, autodeploys from main
#
# It used to be three: the app, HydraDB as a private service with a 10GB disk,
# and a background worker. That layout was correct and it was also most of the
# hosting bill, because a private service and a disk are both paid tiers. When
# the credit ran out the graph service went away, and with it every traversal
# on the site — the console's blast radius, chains and paths panels all showing
# "the dependency graph is unavailable" while the OSV-backed half kept working.
#
# So the graph runs inside the web container now. That is sound rather than a
# shortcut, for one specific reason: the graph is *derived* data. Postgres holds
# every edge the crawler has ever written, so the graph node can live on an
# ephemeral filesystem and be rebuilt from the sidecar at boot — seconds, and no
# traffic to npm. See rehydrate.py and deploy/app-entrypoint.sh. What would be
# reckless for a system of record is routine for a cache.
#
# Consequences worth knowing before editing this file:
#
#   * The graph binds 127.0.0.1 inside the container. Nothing outside can reach
#     it, which is a stronger boundary than the private service had — that one
#     was reachable by anything else on the account's network.
#   * The graph is bounded to what the instance can hold (REHYDRATE_MAX_EDGES).
#     The API reports coverage per response, so a partial graph is visible to
#     the caller rather than quietly answering with a smaller number.
#   * There is no worker. The crawl's discovery half is off here; see
#     LIVE_INGEST below for what that does and does not cost.
#
# Secrets are `sync: false`, which means Render prompts for them at deploy time
# and stores them encrypted. They are never in this file and never in the repo.
#
# Apply:  render.com -> Blueprints -> New Blueprint Instance -> point at this repo

previewsEnabled: false

services:
  - type: web
    name: blast-radius-web
    runtime: docker
    plan: starter            # revisit after measuring; see DEPLOY.md
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerCommand. The image already resolves to exactly this —
    # ENTRYPOINT ["/usr/local/bin/app-entrypoint.sh"] plus CMD ["web"] — and
    # naming it here again only creates a way to be wrong. Docker appends a
    # command to an ENTRYPOINT rather than replacing it, so under that reading
    # `dockerCommand: /usr/local/bin/app-entrypoint.sh web` starts the
    # container as
    #     app-entrypoint.sh /usr/local/bin/app-entrypoint.sh web
    # and the script exits 64 on `unknown role '/usr/local/bin/...'`. Verified
    # by running the built image that way. Saying nothing is correct under both
    # readings; saying it is correct under only one of them.
    autoDeploy: true
    branch: main

    # Render restarts the service when this stops answering.
    #
    # /api/health answers 200 whenever the process can compose a response, and
    # says what is wrong in the body rather than in the status code. That is
    # deliberate and it is not an oversight to "fix": a health check wired to
    # dependency health means every OSV or Postgres hiccup restarts the app,
    # which repairs none of them and takes the working half of the product down
    # with it. It has already cost this deployment one outage.
    #
    # The one failure a restart *does* fix — graph-node dying inside this
    # container — is handled where it can be observed directly, by the watchdog
    # in deploy/app-entrypoint.sh, not by inference from a status code.
    healthCheckPath: /api/health

    envVars:
      # The graph is a process in this container, reachable on loopback and
      # nowhere else, so HYDRA_URL and HYDRA_ADMIN_URL are baked into the image
      # rather than set here — see the Dockerfile. They were a pair of
      # hand-maintained hostnames carrying Render's own service suffix, and
      # they were the single most breakage-prone thing in this file: recreate
      # the service, the suffix changes, and every traversal fails against a
      # database that is perfectly healthy.
      #
      # Still required: the token. The graph authenticates against a file, and
      # the entrypoint writes this into it at boot.
      - key: HYDRA_TOKEN
        sync: false           # any 32-byte secret: openssl rand -hex 32

      - key: PUBLIC_URL
        sync: false           # e.g. https://blastradius.dev — used in emails,
                              # webhook payloads and the docs examples
      - key: SECURE_COOKIES
        value: "1"            # Render terminates TLS; the cookie must say Secure

      # Accounts. Leave blank to use the local password store.
      # The predicate store: semver ranges and maintainers, in Supabase
      # Postgres. Without it the process falls back to a local SQLite file no
      # crawler has ever written to, every dependent lookup runs against an
      # empty database, and health reports the store down. Use the POOLER
      # endpoint (aws-0-<region>.pooler.supabase.com:6543) — the direct
      # db.<ref>.supabase.co endpoint holds a real backend per connection and
      # resolves on fewer networks. Keep its region matched to this blueprint's.
      - key: DATABASE_URL
        sync: false

      # Keyed digest for API keys. Any long random string; generate one with
      #     python -c "import secrets; print(secrets.token_urlsafe(48))"
      # It never leaves this process. Without it a copy of the api_keys table
      # lets someone verify guessed keys offline; with it the table is inert on
      # its own. Keys issued before it was set keep working and are upgraded
      # the next time they are used, so it can be added to a running service —
      # but changing it later invalidates every key at once.
      - key: BLAST_KEY_PEPPER
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Alert email. Not SMTP from the instance IP — a fresh cloud IP has no
      # sending reputation and lands in spam. See DEPLOY.md.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      # The web process serves; the worker crawls. Both would fight over the
      # same checkpoint file.
      # On, at 512MiB, and it took real work to get there — see the commit.
      # The registry pollers write straight into HydraDB, which is what the
      # "five registries, right now" panel shows and what makes a watched
      # project's alert fire. Measured with everything running: peak 376MiB.
      - key: LIVE_INGEST
        value: "1"

      # The publish ticker. It enriches each publish through the registry, and
      # the reason that used to cost 378MiB was a cache holding whole npm
      # packuments — documents that are individually megabytes, in a cache
      # bounded by entry count. Capped and no longer retained, so it fits.
      - key: LIVE_FEED
        value: "1"

      # How much of the graph to rebuild at boot, in edges.
      #
      # This was 55,000, chosen from the resident size of an *idle* container,
      # and idle is the wrong thing to measure. Under concurrent audits and
      # depth-8 traversals the same container ran at 485MiB of 512MiB — 95%,
      # and 27MiB from the kill — and the full test suite duly tipped it over:
      # the cgroup took graph-node six minutes in, OOMKilled=true, exactly the
      # process whose death used to leave the site up and unable to answer.
      #
      # Measured in the real container, same load in every row:
      #
      #     edges     idle      under load
      #     40,000    221MiB    252MiB   49%
      #     48,000    327MiB    352MiB   69%
      #     56,000    376MiB    485MiB   95%   <- OOM under the test suite
      #
      # The jump is in the traversal working set, not the resident graph, which
      # is why measuring at idle hid it. 48,000 leaves ~160MiB of headroom.
      #
      # Raise it on a larger plan — 2GB fits the whole 137,688-edge set, and
      # unsetting it entirely rebuilds the complete graph, at which point no
      # answer carries a coverage caveat.
      #
      # Edges load most-depended-upon first, so what a bounded graph keeps is
      # the packages anyone actually asks about during an incident — plus the
      # pinned incident set, which popularity ranking would otherwise drop
      # entirely. Anything the rebuild could not hold complete is reported as a
      # floor on the response rather than answered with a smaller number.
      # Lowered from 48,000 because the registry pollers now share this
      # instance and the graph has to leave them room. This is measured, not
      # rounded: at 55,000 edges with ingestion running, the container peaked at
      # 500MiB and graph-node was OOM-killed within minutes; at 28,000 it peaks
      # at 376MiB and holds. The traversals a bounded graph cannot fully answer
      # say so on the response rather than returning a smaller number.
      - key: REHYDRATE_MAX_EDGES
        value: "28000"

      # Sizes the graph node's caches to the instance. See app-entrypoint.sh:
      # its defaults assume it owns the machine and allocate a 1GiB cache.
      - key: GRAPH_MEM_BUDGET_MB
        value: "512"
      # One worker. Two gunicorn workers are two full copies of the app —
      # interpreter, fixtures, Supabase client, connection pool — and on a
      # 512Mi Starter instance that was an OOM kill loop rather than a
      # throughput gain. The work here is I/O-bound on the graph and Postgres,
      # which one uvicorn worker already overlaps via async; a second process
      # buys concurrency this workload was not short of.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LOG_FORMAT
        value: json

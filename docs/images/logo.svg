<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Blast Radius">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8564a"/>
      <stop offset="100%" stop-color="#d63a2f"/>
    </radialGradient>
  </defs>

  <!-- the outer rings: exposure attenuating with depth -->
  <circle cx="48" cy="48" r="45" fill="none" stroke="#2f6bff" stroke-width="2" opacity=".14"/>
  <circle cx="48" cy="48" r="35" fill="none" stroke="#2f6bff" stroke-width="2.5" opacity=".28"/>
  <circle cx="48" cy="48" r="25" fill="none" stroke="#2f6bff" stroke-width="3" opacity=".5"/>

  <!-- the compromised package at the centre -->
  <circle cx="48" cy="48" r="14" fill="url(#core)"/>

  <!-- a few dependents caught in the blast -->
  <circle cx="79" cy="27" r="5" fill="#2f6bff" opacity=".55"/>
  <circle cx="20" cy="70" r="4" fill="#2f6bff" opacity=".4"/>
  <circle cx="72" cy="74" r="3.4" fill="#2f6bff" opacity=".3"/>
  <circle cx="24" cy="26" r="3" fill="#2f6bff" opacity=".26"/>
</svg>

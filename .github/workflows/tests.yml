# The layers of the suite that need no HydraDB, no crawl and no browser.
name: tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Semver and lockfile parsing
        # The graph, API and browser layers skip themselves with a reason when
        # their service is absent, so this is a useful signal in bare CI.
        run: python -m pytest tests -q

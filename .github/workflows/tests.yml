# The layers of the suite that need no HydraDB, no crawl and no browser.
name: tests

on: [push, pull_request]

# The default GITHUB_TOKEN is broad — on some repository settings it can write
# contents, packages and more. Neither of these jobs pushes anything: they
# check out the code and run a command. Declaring the minimum here means a
# compromised dependency in the toolchain cannot use the token to write to the
# repository, which for a supply-chain project is not a hypothetical.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Semver and lockfile parsing
        # The graph, API and browser layers skip themselves with a reason when
        # their service is absent, so this is a useful signal in bare CI.
        run: python -m pytest tests -q
